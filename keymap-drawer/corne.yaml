layout: {zmk_keyboard: corne}
layers:
  default: [ESCAPE, '&luces', W, E, R, T, Y, U, I, O, P, '$$mdi:backspace-outline$$', ↹, A, S, D, F, G, H, J, K, L, '&commadot', '&comillas', '&mayuscula', Z, X,
    C, V, B, N, M, '&comma', '&dot', '&slash', ENTER, LEFT CONTROL, lower, ␣, ␣, raise, '$$mdi:apple-keyboard-option$$']
  lower:
  - Esc
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '7'
  - '8'
  - '9'
  - '0'
  - $$mdi:backspace-outline$$
  - BT CLR
  - BT 1
  - BT 2
  - BT 3
  - BT 4
  - BT 5
  - {t: '$$mdi:led-on$$', h: '$$mdi:page-previous-outline$$', type: tap_dance}
  - {t: '$$mdi:led-on$$', h: '$$mdi:speedometer$$', type: sym_by_sym}
  - {t: '$$mdi:led-outline$$', s: '$$tabler:brightness-down$$', type: sym_by_sym}
  - Page Up
  - UP ARROW
  - PAGE DOWN
  - $$mdi:apple-keyboard-shift$$
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - EP TOG
  - {t: '$$mdi:led-on$$', h: '$$mdi:page-next-outline$$', type: tap_dance}
  - {t: '$$mdi:led-on$$', h: '$$mdi:speedometer-slow$$', type: sym_by_sym}
  - {t: '$$mdi:led-on$$', s: '$$tabler:brightness-up$$', type: sym_by_sym}
  - LEFT ARROW
  - DOWN ARROW
  - RIGHT ARROW
  - $$mdi:apple-keyboard-command$$
  - {type: held}
  - ␣
  - ␣
  - {t: ▽, type: trans}
  - $$mdi:apple-keyboard-option$$
  raise:
  - ↹
  - '!'
  - '@'
  - '#'
  - $
  - '%'
  - ^
  - AMPS
  - '*'
  - (
  - )
  - $$mdi:backspace-outline$$
  - F1
  - F2
  - F3
  - F4
  - F5
  - F6
  - '-'
  - '='
  - '['
  - ']'
  - \
  - '`'
  - F7
  - F8
  - F9
  - F10
  - F11
  - F12
  - _
  - +
  - '{'
  - '}'
  - '|'
  - '~'
  - $$mdi:apple-keyboard-command$$
  - {t: ▽, type: trans}
  - ␣
  - ⏎
  - {type: held}
  - $$mdi:apple-keyboard-option$$
